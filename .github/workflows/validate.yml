name: Validate OTA setup
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Parse PowerShell and reject unsigned packages
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'scripts/New-WindowsManifest.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw ($errors|Out-String)}
          $fixture=Join-Path $env:RUNNER_TEMP 'unsigned.msi'
          $output=Join-Path $env:RUNNER_TEMP 'windows.json'
          [IO.File]::WriteAllBytes($fixture,[byte[]](1,2,3,4))
          $rejected=$false
          try{./scripts/New-WindowsManifest.ps1 -MsiPath $fixture -Version 0.10.6 -SignerThumbprints ('A'*40) -OutputPath $output}catch{if($_.Exception.Message -notmatch 'unsigned|untrusted'){throw};$rejected=$true}
          if(!$rejected -or (Test-Path -LiteralPath $output)){throw 'An unsigned package was accepted.'}
          Write-Output 'PASS: script parses and an unsigned package cannot produce a release manifest.'
