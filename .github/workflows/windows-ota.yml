name: Verify and publish Windows OTA
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (for example v0.10.6)
        required: true
        type: string
      publish:
        description: Publish the verified draft to devices
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: windows-ota-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      PUBLISH_RELEASE: ${{ inputs.publish }}
      SIGNER_THUMBPRINTS: ${{ vars.WINDOWS_SIGNER_THUMBPRINTS }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate draft and download package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$'){throw 'A version tag such as v0.10.6 is required.'}
          if(!$env:SIGNER_THUMBPRINTS){throw 'Set the WINDOWS_SIGNER_THUMBPRINTS repository variable first.'}
          $release=gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,tagName | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or !$release.isDraft -or $release.tagName -ne $env:RELEASE_TAG){throw 'Only an existing draft release can be prepared.'}
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern EvidruneAgent.msi --dir release
          if($LASTEXITCODE -ne 0){throw 'Upload a signed EvidruneAgent.msi to the draft first.'}
      - name: Verify product, signature and version
        shell: pwsh
        run: |
          ./scripts/New-WindowsManifest.ps1 -MsiPath ./release/EvidruneAgent.msi -Version ($env:RELEASE_TAG.Substring(1)) -SignerThumbprints $env:SIGNER_THUMBPRINTS -OutputPath ./release/windows.json
      - name: Upload verified manifest and optionally publish
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or !$release.isDraft){throw 'Release is no longer a draft; refusing to replace assets.'}
          gh release upload $env:RELEASE_TAG ./release/windows.json --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw 'Manifest upload failed.'}
          if($env:PUBLISH_RELEASE -eq 'true'){
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
            if($LASTEXITCODE -ne 0){throw 'Release publication failed.'}
          }
